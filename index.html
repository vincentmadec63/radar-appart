<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar Appart</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Les annonces d'appartements à vendre à Namur et alentours, rassemblées et triées par date de mise en ligne.">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#EDF0F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1518" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Radar Appart">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Familjen+Grotesk:wght@500;600;700&display=swap">
<style>
/* Appli de poche : en-tête compact, onglets sous le pouce, une annonce par carte ; la date de repérage ouvre chaque carte. */
:root {
  --bg: #EDF0F1;          /* pierre de Meuse, très claire */
  --surface: #FFFFFF;
  --surface-2: #E1E6E8;
  --ink: #172126;         /* ardoise */
  --ink-2: #4D5D65;
  --line: #D2D9DC;
  --accent: #1D5A78;      /* bleu Meuse */
  --accent-ink: #FFFFFF;
  --heart: #C4372C;       /* brique */
  --heart-soft: #F7E1DE;
  --good: #2D7A4E;
  --good-soft: #DFF0E5;
  --warn: #9A6514;
  --warn-soft: #F6EBD6;
  --fresh: #0E7C66;
  --bar: rgba(237, 240, 241, .86);
  --shadow: 0 1px 2px rgba(23,33,38,.06), 0 6px 18px rgba(23,33,38,.07);
  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Atkinson Hyperlegible", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --r: 16px;
  --tabbar: 58px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F1518; --surface: #172024; --surface-2: #202B30; --ink: #E5EBED; --ink-2: #9DAEB5;
    --line: #2B383E; --accent: #79B7D8; --accent-ink: #0B1A22; --heart: #F0705F; --heart-soft: #3A2220;
    --good: #6CCB93; --good-soft: #1C3226; --warn: #E3B467; --warn-soft: #3A2F1C; --fresh: #5FD0B5;
    --bar: rgba(15, 21, 24, .86);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html.locked, html.locked body { overflow: hidden; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--f-body);
  padding-bottom: calc(var(--tabbar) + var(--sab) + 8px);
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
button, select, input, textarea { font: inherit; color: inherit; }
/* 16 px minimum : en dessous, Safari zoome la page au toucher d'un champ. */
select, input, textarea { font-size: 16px !important; }
button, a, select, label { touch-action: manipulation; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* En-tête */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: var(--sat); z-index: 31; background: var(--bar); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.top { position: sticky; top: var(--sat); z-index: 30; background: var(--bar); backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; min-height: 56px; }
.brand { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.brand h1 { margin: 0; font: 700 1.35rem/1.05 var(--f-display); letter-spacing: -.01em; }
.brand h1 span { color: var(--heart); }
.sync { font-size: .78rem; color: var(--ink-2); display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--fresh); display: inline-block; flex: none; }
.sync.stale i { background: var(--warn); }
.top-actions { display: flex; align-items: center; gap: 4px; }
.icon-btn { appearance: none; border: 0; background: none; width: 44px; height: 44px; border-radius: 12px; display: inline-grid; place-items: center; color: var(--ink); cursor: pointer; }
.icon-btn:active { background: var(--surface-2); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.tabs-top { display: none; gap: 4px; }

/* Barre d'onglets du bas (téléphone) */
.tabbar { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; background: var(--bar); backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px);
  border-top: 1px solid var(--line); padding-bottom: var(--sab); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); display: grid; grid-template-columns: repeat(3, 1fr); }
.tabbar button { appearance: none; border: 0; background: none; height: var(--tabbar); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--ink-2); font: 600 .72rem var(--f-body); cursor: pointer; position: relative; }
.tabbar button svg { width: 25px; height: 25px; }
.tabbar button[aria-selected="true"] { color: var(--accent); }
.tabbar .n { position: absolute; top: 5px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--heart); color: #fff; font: 700 .7rem/18px var(--f-body); text-align: center; }
.tabbar .n:empty, .tabbar .n[data-zero] { display: none; }

@media (min-width: 900px) {
  body { padding-bottom: 24px; }
  .tabbar { display: none; }
  .tabs-top { display: flex; }
  .tab { appearance: none; border: 0; background: none; padding: 10px 14px; font: 600 .98rem var(--f-display); color: var(--ink-2); border-radius: 10px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
  .tab[aria-selected="true"] { color: var(--ink); background: var(--surface-2); }
  .tab .n { font: 700 .72rem var(--f-body); background: var(--heart); color: #fff; border-radius: 999px; padding: 1px 7px; }
  .tab .n[data-zero] { display: none; }
}

main .wrap { padding-block: 14px 28px; display: flex; flex-direction: column; gap: 14px; }
section { display: flex; flex-direction: column; gap: 14px; }

/* Bandeaux */
.note { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; }
.note p { margin: 0; color: var(--ink-2); font-size: .9rem; flex: 1; }
.note strong { color: var(--ink); }
.note.example { border-style: dashed; }
.note .icon-btn { margin: -10px -8px -10px 0; }
.pulse { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.pulse button { appearance: none; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 10px 9px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; min-height: 64px; }
.pulse button:active { transform: scale(.97); }
.pulse b { font: 700 1.4rem/1.05 var(--f-display); font-variant-numeric: tabular-nums; }
.pulse span { font-size: .74rem; line-height: 1.2; color: var(--ink-2); }
.pulse .is-heart b { color: var(--heart); }
.pulse .is-new b { color: var(--fresh); }
.pulse button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
@media (min-width: 720px) { .pulse button { padding: 12px 14px; } .pulse b { font-size: 1.7rem; } .pulse span { font-size: .86rem; } }

.cta { appearance: none; border: 0; width: 100%; min-height: 60px; border-radius: var(--r); background: var(--ink); color: var(--bg); font: 700 1.02rem/1.2 var(--f-display); display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 10px 16px; text-align: left; }
.cta > span { display: flex; flex-direction: column; gap: 1px; flex: 1; }
.cta::after { content: ""; width: 9px; height: 9px; border-right: 2px solid currentColor; border-top: 2px solid currentColor; transform: rotate(45deg); flex: none; margin-right: 4px; }
.cta:active { transform: scale(.985); }
.cta svg { width: 22px; height: 22px; }
.cta small { font: 400 .82rem var(--f-body); opacity: .75; }

.setup { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.setup h2 { margin: 0; font: 700 1.1rem var(--f-display); text-wrap: balance; }
.setup p { margin: 0; color: var(--ink-2); font-size: .92rem; }
.setup .row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

/* Barre d'outils */
.toolbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.toolbar .check { font-size: .88rem; white-space: nowrap; }
.toolbar select { max-width: 180px; }
.sort { display: flex; gap: 8px; align-items: center; font-size: .88rem; color: var(--ink-2); }
select, input[type="number"], input[type="text"], textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; min-height: 44px; min-width: 0; }
select { padding-right: 8px; }
textarea { padding: 10px 12px; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--ink-2); min-width: 0; }
label.field input { color: var(--ink); width: 100%; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: .9rem; color: var(--ink-2); cursor: pointer; min-height: 44px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }

/* Fil */
.day { font: 700 .76rem var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); margin: 6px 0 -4px; display: flex; gap: 10px; align-items: center; }
.day::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 720px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; } }
@media (min-width: 1080px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; min-width: 0; scroll-margin-top: calc(var(--sat) + 70px); }
.card.is-out { opacity: .6; }
.card.flash { box-shadow: 0 0 0 3px var(--accent), var(--shadow); }
.card.is-cdc { box-shadow: 0 0 0 2px var(--heart), var(--shadow); }
.ph { position: relative; display: block; aspect-ratio: 4 / 3; max-width: 100%; background: var(--surface-2); color: var(--ink); text-decoration: none; overflow: hidden; }
@media (min-width: 720px) { .card .ph { aspect-ratio: 16 / 10; } }
.ph img { width: 100%; height: 100%; object-fit: cover; position: relative; z-index: 1; }
.ph.noimg img { display: none; }
.ph-fb { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 44px 16px;
  background: repeating-linear-gradient(135deg, transparent 0 14px, color-mix(in srgb, var(--ink) 5%, transparent) 14px 15px), var(--surface-2); }
.ph-fb b { font: 700 1.6rem/1.05 var(--f-display); }
.ph-fb span { font-size: .85rem; color: var(--ink-2); }
.badge { position: absolute; z-index: 2; font: 700 .76rem/1 var(--f-body); padding: 7px 10px; border-radius: 999px; background: rgba(15,21,24,.74); color: #fff; letter-spacing: .01em; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.b-fresh { top: 10px; left: 10px; }
.b-fresh.hot { background: var(--fresh); }
.b-src { top: 10px; right: 10px; }
.b-cdc { bottom: 10px; left: 10px; background: var(--heart); font-size: .82rem; padding: 8px 11px; }
.b-new { bottom: 10px; right: 10px; background: #fff; color: #172126; }
.body { padding: 14px 16px 14px; display: flex; flex-direction: column; gap: 8px; }
.r1 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.price { font: 700 1.6rem/1 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.ppm { font-size: .84rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.drop { font: 700 .78rem var(--f-body); color: var(--good); background: var(--good-soft); border-radius: 6px; padding: 3px 7px; }
.ttl { margin: 0; font: 600 1.06rem/1.25 var(--f-display); }
.ttl small { display: block; font: 400 .9rem/1.35 var(--f-body); color: var(--ink-2); margin-top: 2px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: .92rem; align-items: center; font-variant-numeric: tabular-nums; }
.facts .dot { color: var(--line); }
.when { font-size: .88rem; color: var(--ink-2); border-left: 3px solid var(--fresh); padding-left: 8px; }
.when b { color: var(--ink); }
.when.old { border-left-color: var(--line); }

.peb { --c: #999; display: inline-flex; align-items: center; height: 22px; padding: 0 12px 0 7px; background: var(--c); color: #fff; font: 700 .8rem/1 var(--f-display);
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 0 100%); }
.peb[data-p="A++"], .peb[data-p="A+"], .peb[data-p="A"] { --c: #1E8A3B; }
.peb[data-p="B"] { --c: #58A532; } .peb[data-p="C"] { --c: #A6BD1E; color: #1b1b1b; }
.peb[data-p="D"] { --c: #F2C411; color: #1b1b1b; } .peb[data-p="E"] { --c: #EF9A1B; color: #1b1b1b; }
.peb[data-p="F"] { --c: #E3611B; } .peb[data-p="G"] { --c: #D2231E; }
.peb[data-p="?"] { --c: var(--surface-2); color: var(--ink-2); }

.score { display: flex; flex-direction: column; gap: 6px; padding-top: 2px; }
.meter { display: flex; align-items: center; gap: 10px; font-size: .84rem; color: var(--ink-2); }
.meter .bar { flex: 1; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.meter.cdc .bar i { background: var(--heart); }
.meter b { font: 700 1.05rem var(--f-display); color: var(--ink); font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }
.reasons { display: flex; flex-wrap: wrap; gap: 5px; }
.rs { font-size: .78rem; border-radius: 6px; padding: 3px 7px; background: var(--good-soft); color: var(--good); }
.rs.m { background: var(--warn-soft); color: var(--warn); }
.rs.x { background: var(--heart-soft); color: var(--heart); font-weight: 700; }

.actions { display: flex; gap: 8px; padding-top: 6px; align-items: center; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; min-height: 44px; padding: 0 14px; font: 600 .94rem var(--f-display); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:active { transform: scale(.96); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); flex: 1; }
.btn.fav[aria-pressed="true"] { background: var(--heart); border-color: var(--heart); color: #fff; }
.btn.sq { width: 44px; padding: 0; flex: none; }
.btn svg { width: 19px; height: 19px; flex: none; }

.why { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; background: var(--surface-2); border-radius: 12px; }
.why p { margin: 0 0 2px; width: 100%; font-size: .84rem; color: var(--ink-2); }
.chip { appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; min-height: 40px; padding: 0 14px; font-size: .9rem; cursor: pointer; }
.chip:active { transform: scale(.96); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

details.more { border-top: 1px solid var(--line); margin-top: 4px; }
details.more summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; justify-content: space-between; font: 600 .92rem var(--f-display); color: var(--ink-2); list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: ""; width: 9px; height: 9px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg) translate(-2px, -2px); transition: transform .2s; }
details.more[open] summary::after { transform: rotate(-135deg) translate(-2px, -2px); }
.dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: .9rem; font-variant-numeric: tabular-nums; margin: 6px 0; }
.dl dt { color: var(--ink-2); }
.dl dd { margin: 0; text-align: right; }
.dl .tot { font-weight: 700; color: var(--ink); border-top: 1px solid var(--line); padding-top: 4px; }
.small { font-size: .82rem; color: var(--ink-2); margin: 4px 0; }
.sub { font: 700 .74rem var(--f-body); text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); margin: 14px 0 4px; }
.extrait { font-size: .92rem; margin: 2px 0 6px; }
.status-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
textarea { width: 100%; min-height: 80px; resize: vertical; margin-top: 8px; }
ul.check-list { margin: 4px 0; padding-left: 18px; font-size: .9rem; display: flex; flex-direction: column; gap: 3px; }

/* Mode découverte : une annonce à la fois, glisser pour décider */
.deck { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column;
  padding: calc(var(--sat) + 6px) max(16px, env(safe-area-inset-right, 0px)) calc(var(--sab) + 14px) max(16px, env(safe-area-inset-left, 0px)); overscroll-behavior: contain; }
.deck-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; }
.deck-head b { font: 700 1.05rem var(--f-display); }
.deck-head span { font-size: .85rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.progress { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; margin-bottom: 10px; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.deck-stage { flex: 1; position: relative; min-height: 0; display: flex; max-width: 520px; width: 100%; margin: 0 auto; }
.dcard { position: relative; flex: 1; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; touch-action: pan-y; user-select: none; -webkit-user-select: none; will-change: transform; min-height: 0; }
.dcard .ph { aspect-ratio: auto; flex: 1 1 auto; min-height: 120px; pointer-events: none; }
.dcard .body { flex: 0 0 auto; overflow: hidden; }
.dcard .ttl small { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.stamp { position: absolute; z-index: 3; top: 22px; padding: 8px 14px; border: 3px solid; border-radius: 10px; font: 700 1.3rem var(--f-display); letter-spacing: .06em; opacity: 0; text-transform: uppercase; background: rgba(255,255,255,.9); }
.stamp.keep { left: 18px; color: var(--heart); border-color: var(--heart); transform: rotate(-10deg); }
.stamp.skip { right: 18px; color: #4D5D65; border-color: #4D5D65; transform: rotate(10deg); }
.deck-ctrl { display: grid; grid-template-columns: 1fr auto auto auto 1fr; align-items: center; gap: 14px; padding-top: 14px; max-width: 520px; width: 100%; margin: 0 auto; }
.round { appearance: none; border: 1px solid var(--line); background: var(--surface); width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow); color: var(--ink-2); }
.round:active { transform: scale(.92); }
.round svg { width: 28px; height: 28px; }
.round.keep { color: #fff; background: var(--heart); border-color: var(--heart); width: 72px; height: 72px; }
.round.keep svg { width: 32px; height: 32px; }
.round.open { width: 52px; height: 52px; color: var(--accent); }
.round.open svg { width: 22px; height: 22px; }
.link-btn { appearance: none; border: 0; background: none; color: var(--ink-2); font: 600 .88rem var(--f-display); min-height: 44px; cursor: pointer; padding: 0 4px; white-space: nowrap; }
.deck-ctrl .link-btn:first-child { justify-self: start; }
.deck-ctrl .link-btn:last-child { justify-self: end; }
.deck-done { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 20px; }
.deck-done b { font: 700 1.6rem var(--f-display); text-wrap: balance; }
.deck-done p { margin: 0; color: var(--ink-2); max-width: 30ch; }

/* Alertes à l'ouverture */
.scrim { position: fixed; inset: 0; z-index: 55; background: rgba(10, 16, 19, .45); }

function renderSync() {
  var m = state.meta || {}, el = document.getElementById('sync');
  if (navigator.onLine === false) { el.className = 'sync stale'; el.innerHTML = '<i></i><span>Hors connexion · dernières annonces gardées</span>'; return; }
  if (!m.lastRun) { el.className = 'sync stale'; el.innerHTML = '<i></i><span>Première relève à venir</span>'; return; }
  var stale = Date.now() - Date.parse(m.lastRun) > 15 * 36e5;
  var d = new Date(m.lastRun), today = new Date().toDateString() === d.toDateString();
  var when = (today ? 'aujourd’hui' : d.toLocaleDateString('fr-BE', { weekday: 'short', day: 'numeric' })) + ' à ' + d.toLocaleTimeString('fr-BE', { hour: '2-digit', minute: '2-digit' });

/* Mode découverte */

function closeDeck() {

}
function renderDeck() {
  var d = state.deck, el = document.getElementById('deck');
  var total = d.ids.length, done = d.i >= total;
  var head = '<div class="deck-head"><div><b>À trier</b> <span>' + Math.min(d.i + 1, total) + ' / ' + total + '</span></div><button class="icon-btn" data-act="deckClose" aria-label="Fermer">' + ICON.close + '</button></div>' +
    '<div class="progress"><i style="width:' + Math.round(100 * d.i / total) + '%"></i></div>';

      '<button class="btn primary" style="flex:none;padding:0 22px" data-act="' + (d.kept ? 'deckToSel' : 'deckClose') + '">' + (d.kept ? 'Voir ma sélection' : 'Retour au fil') + '</button></div>';

    '<div class="deck-stage"><div class="dcard" id="dcard">' + photo(l) + badges(r) + '</a>' +
      '<span class="stamp keep" id="stKeep">Gardée</span><span class="stamp skip" id="stSkip">Écartée</span>' +
      '<div class="body">' + priceRow(r) + '<h3 class="ttl">' + esc(l.commune || '') + '<small>' + esc(l.title || '') + '</small></h3>' + factsOf(l) + whenRow(l) + scoreRow(r, 3) + '</div>' +
    '</div></div>' +
    '<div class="deck-ctrl">' +
      '<button class="link-btn" data-act="deckBack"' + (d.i ? '' : ' disabled style="visibility:hidden"') + '>Retour</button>' +
      '<button class="round" data-act="deckOut" aria-label="Écarter">' + ICON.out + '</button>' +
      '<a class="round open" href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer" aria-label="Ouvrir l’annonce">' + ICON.ext + '</a>' +
      '<button class="round keep" data-act="deckKeep" aria-label="Garder">' + ICON.heart + '</button>' +
      '<button class="link-btn" data-act="deckSkip">Plus tard</button>' +
    '</div>' + (d.i === 0 ? '<p class="hint-swipe">Glisse à droite pour garder, à gauche pour écarter.</p>' : '');
  bindSwipe(document.getElementById('dcard'));
}
function deckDecide(kind) {
  var d = state.deck; if (!d) return;
  var id = d.ids[d.i];
  if (kind === 'keep') { saveStatus(id, { s: 'fav' }); d.kept++; }
  else if (kind === 'out') { saveStatus(id, { s: 'out' }); d.out++; }
  d.i++;
  enrich(); renderDeck();
}
function flyOut(card, dir, kind) {
  if (REDUCED || !card) return deckDecide(kind);
  card.style.transition = 'transform .25s ease-in, opacity .25s';
  card.style.transform = 'translateX(' + (dir * window.innerWidth) + 'px) rotate(' + (dir * 18) + 'deg)';
  card.style.opacity = '0';
  setTimeout(function () { deckDecide(kind); }, 220);
}
function bindSwipe(card) {
  if (!card) return;
  var x0 = null, y0 = 0, dx = 0, locked = null, keep = document.getElementById('stKeep'), skip = document.getElementById('stSkip');
  card.addEventListener('pointerdown', function (e) { if (e.button) return; x0 = e.clientX; y0 = e.clientY; dx = 0; locked = null; card.style.transition = 'none'; });
  card.addEventListener('pointermove', function (e) {
    if (x0 == null) return;
    var mx = e.clientX - x0, my = e.clientY - y0;
    if (locked == null && (Math.abs(mx) > 8 || Math.abs(my) > 8)) { locked = Math.abs(mx) > Math.abs(my) ? 'x' : 'y'; if (locked === 'x') card.setPointerCapture(e.pointerId); }
    if (locked !== 'x') return;
    dx = mx;
    card.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 18) + 'deg)';
    keep.style.opacity = Math.max(0, Math.min(1, dx / 90));
    skip.style.opacity = Math.max(0, Math.min(1, -dx / 90));
  });
  function end() {
    if (x0 == null) return;
    x0 = null;
    if (locked === 'x' && Math.abs(dx) > 95) return flyOut(card, dx > 0 ? 1 : -1, dx > 0 ? 'keep' : 'out');
    card.style.transition = 'transform .2s ease-out';
    card.style.transform = ''; keep.style.opacity = 0; skip.style.opacity = 0;
  }
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
  // Empêche d'ouvrir l'annonce par erreur à la fin d'un glissement
  card.addEventListener('click', function (e) { if (Math.abs(dx) > 8) { e.preventDefault(); e.stopPropagation(); } }, true);
}

function saveStatus(id, patch) {
  var cur = Object.assign({}, state.status[id] || {}, patch, { at: Date.now() });
  if (!cur.s && !cur.note) delete state.status[id]; else state.status[id] = cur;
  LS.set('status', state.status);
}
function saveCrit(patch) {
  state.criteria = Object.assign({ threshold: 75, hpu: true, equip: {} }, state.criteria || {}, patch);
  LS.set('criteria', state.criteria);
}
function keepScroll(fn) { var y = window.scrollY; fn(); window.scrollTo(0, y); }
var toastTm;
function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTm); toastTm = setTimeout(function () { t.hidden = true; }, 2400); }
function copy(text, okMsg) {
  var fallback = function () {
    var t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select(); t.setSelectionRange(0, text.length);
    try { document.execCommand('copy'); toast(okMsg); } catch (e) { toast('Copie impossible'); } t.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, fallback);
  else fallback();
}
function share(data, copyText) {
  if (navigator.share) { navigator.share(data).catch(function () {}); return; }
  copy(copyText || data.url, 'Lien copié');
}

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act],[data-f],[data-v],[data-seg],[data-commune]');
  if (!t) return;
  if (t.dataset.v) { if (t.dataset.v !== 'sel') state.pick = null; setView(t.dataset.v); render(); window.scrollTo(0, 0); return; }
  if (t.dataset.f) { state.filter = t.dataset.f; LS.set('filter', state.filter); render(); return; }
  if (t.dataset.seg) {
    var name = t.dataset.seg, val = t.dataset.val;
    if (name.indexOf('eq-') === 0) { var eq = Object.assign({}, (state.criteria || {}).equip); eq[name.slice(3)] = val; saveCrit({ equip: eq }); }
    else if (name === 'bedroomsMin') saveCrit({ bedroomsMin: val ? +val : null });
    else if (name === 'pebMax') saveCrit({ pebMax: val || null });
    keepScroll(render); return;
  }
  if (t.dataset.commune) {
    var list = ((state.criteria || {}).communes || []).slice(), i = list.indexOf(t.dataset.commune);
    if (i >= 0) list.splice(i, 1); else list.push(t.dataset.commune);
    saveCrit({ communes: list }); keepScroll(render); return;
  }
  var id = t.dataset.id, a = t.dataset.act, st = state.status[id] || {};
  if (a === 'fav') { var on = !(st.s && st.s !== 'out'); saveStatus(id, { s: on ? 'fav' : null }); keepScroll(render); if (on) toast('Ajoutée à ta sélection'); }
  else if (a === 'out') {
    if (st.s === 'out') { saveStatus(id, { s: null, why: null }); state.why = null; }
    else { saveStatus(id, { s: 'out' }); state.why = id; }
    keepScroll(render);
  }
  else if (a === 'outwhy') { saveStatus(id, { why: t.dataset.why }); state.why = null; keepScroll(render); }
  else if (a === 'share') {
    var r = rowById(id); if (!r) return;
    var l = r.l, txt = [l.commune, l.surface ? l.surface + ' m²' : '', l.bedrooms != null ? l.bedrooms + ' ch.' : '', eur(l.price)].filter(Boolean).join(' · ');
    share({ title: 'Appartement à ' + (l.commune || ''), text: txt, url: l.url }, txt + ' ' + l.url);
  }
  else if (a === 'goto') {
    setView('feed'); state.filter = 'all'; state.showOut = true; state.flash = id; render();
    var el = document.getElementById('l-' + id); if (el) el.scrollIntoView({ block: 'start' });
  }
  else if (a === 'quick') {
    var bud = +document.getElementById('q-budget').value, bed = +document.getElementById('q-bed').value, sf = +document.getElementById('q-surf').value;
    if (!bud) { document.getElementById('q-budget').focus(); return; }
    saveCrit({ budgetMax: bud, bedroomsMin: bed || null, surfaceMin: sf || null }); render(); toast('Score activé');
  }
  else if (a === 'addCommune') {
    var v = document.getElementById('c-addCommune').value.trim(); if (!v) return;
    var cl = ((state.criteria || {}).communes || []).slice(); if (cl.indexOf(v) < 0) cl.push(v);
    saveCrit({ communes: cl }); keepScroll(render);
  }
  else if (a === 'shareCrit') {
    var link = location.origin + location.pathname + '#c=' + b64(JSON.stringify(state.criteria || {}));
    share({ title: 'Mes critères Radar Appart', text: 'Mes critères pour le Radar Appart :', url: link }, 'Mes critères pour le Radar Appart : ' + link);
  }
  else if (a === 'copySel') copy(b64(JSON.stringify(state.status)), 'Code copié');
  else if (a === 'importSel') {
    try {
      var data = JSON.parse(unb64(document.getElementById('importSel').value.trim()));
      if (typeof data !== 'object' || Array.isArray(data)) throw 0;
      state.status = Object.assign({}, state.status, data); LS.set('status', state.status); render(); toast('Sélection restaurée');
    } catch (err) { toast('Code non reconnu, vérifie qu’il est complet'); }
  }
  else if (a === 'a2hs') { LS.set('a2hs', true); render(); }
  else if (a === 'deck') openDeck();
  else if (a === 'cmpStart') { state.pick = []; render(); }
  else if (a === 'cmpCancel') { state.pick = null; render(); }
  else if (a === 'cmpPick') {
    var pi = state.pick.indexOf(id);
    if (pi >= 0) state.pick.splice(pi, 1); else if (state.pick.length < 3) state.pick.push(id); else toast('3 annonces au maximum');
    keepScroll(render);
  }
  else if (a === 'cmpOpen') openCompare();
  else if (a === 'cmpClose') closeCompare();
  else if (a === 'alertClose') closeSheet();
  else if (a === 'alertDeck') { closeSheet(); openDeck(); }
  else if (a === 'alertGo') {
    closeSheet(); setView('feed'); state.filter = 'all'; state.flash = id; render();
    var ge = document.getElementById('l-' + id); if (ge) ge.scrollIntoView({ block: 'start' });
  }
  else if (a === 'deckClose') closeDeck();
  else if (a === 'deckToSel') { closeDeck(); setView('sel'); render(); window.scrollTo(0, 0); }
  else if (a === 'deckKeep') flyOut(document.getElementById('dcard'), 1, 'keep');
  else if (a === 'deckOut') flyOut(document.getElementById('dcard'), -1, 'out');
  else if (a === 'deckSkip') deckDecide('skip');
  else if (a === 'deckBack') {
    var d = state.deck; if (!d || !d.i) return;
    d.i--; var pid = d.ids[d.i], ps = (state.status[pid] || {}).s;
    if (ps === 'fav') d.kept--; else if (ps === 'out') d.out--;
    saveStatus(pid, { s: null }); enrich(); renderDeck();
  }
});

document.addEventListener('keydown', function (e) {

/* Alertes à l'ouverture : coups de cœur jamais montrés, baisses de prix sur la sélection. */
function pendingAlerts() {
  var seen = LS.get('alerted', {});
  var cdc = state.rows.filter(function (r) { return r.s.coupDeCoeur && !(r.st && r.st.s) && !seen['c:' + r.l.id]; })
    .sort(function (a, b) { return b.s.score - a.s.score; });
  var drops = state.rows.filter(function (r) {
    if (!r.st || !r.st.s || r.st.s === 'out') return false;
    var h = r.l.priceHistory || []; if (h.length < 2) return false;
    var last = h[h.length - 1], prev = h[h.length - 2];
    return last.p < prev.p && !seen['d:' + r.l.id + ':' + last.p];
  });
  return { cdc: cdc, drops: drops, seen: seen };
}
function thumb(l) {
  return '<span class="th">' + (l.photo ? '<img src="' + esc(l.photo) + '" alt="" referrerpolicy="no-referrer" onerror="this.remove()">' : '') + (l.photo ? '' : esc(l.commune || '')) + '</span>';
}
function alertRow(r, kind) {
  var l = r.l, h = l.priceHistory || [];
  var badge = kind === 'drop' ? '<span class="sc drop">−' + Math.round(h[h.length - 2].p - h[h.length - 1].p).toLocaleString('fr-BE') + ' €</span>' : '<span class="sc">' + r.s.score + '</span>';
  return '<button class="alert-row" data-act="alertGo" data-id="' + esc(l.id) + '">' + thumb(l) +
    '<span class="tx"><b>' + eur(l.price) + '</b><span>' + esc([l.commune, l.surface ? l.surface + ' m²' : '', l.bedrooms != null ? l.bedrooms + ' ch.' : ''].filter(Boolean).join(' · ')) + '</span>' +
    '<span>' + (kind === 'drop' ? 'Nouveau prix sur une annonce gardée' : esc((r.s.reasons[0] || {}).t || 'Correspond à tes critères')) + '</span></span>' + badge + '</button>';
}
function maybeAlert() {
  if (state.alertChecked || state.deck || state.flash) return;
  state.alertChecked = true;
  var a = pendingAlerts(), u = untriaged().length;
  if (!a.cdc.length && !a.drops.length) return;
  var first = !visit.prev;
  var html = '<h2 id="sheetTitle">' + (first ? 'Bienvenue sur ton radar' : 'Depuis ta dernière visite') + '</h2>' +
    '<p class="lead">' + (examplesOnly() ? 'Exemples, pour te montrer ce que tu verras à l’ouverture.' : (first ? 'Voici ce qui correspond déjà à tes critères.' : 'Ce qui a bougé pendant ton absence.')) + '</p>';
  if (a.cdc.length) html += '<h3 class="heart">♥ ' + a.cdc.length + ' coup' + (a.cdc.length > 1 ? 's' : '') + ' de cœur</h3>' + a.cdc.slice(0, 5).map(function (r) { return alertRow(r, 'cdc'); }).join('');
  if (a.drops.length) html += '<h3>Baisse' + (a.drops.length > 1 ? 's' : '') + ' de prix sur ta sélection</h3>' + a.drops.map(function (r) { return alertRow(r, 'drop'); }).join('');
  html += '<div class="sheet-actions">' + (u ? '<button class="cta" data-act="alertDeck">' + ICON.cards + '<span>Trier ' + (u > 1 ? 'les ' + u + ' annonces' : 'l’annonce') + ' en attente<small>Une à la fois</small></span></button>' : '') +
    '<button class="btn" data-act="alertClose">Plus tard</button></div>';
  var sh = document.getElementById('sheet');

}
function closeSheet() {

function load(manual) {
  if (state.loading) return;
  state.loading = true;
  var btn = document.getElementById('refresh'); if (manual) btn.classList.add('spin');
  var bust = '?t=' + Date.now();
  Promise.all([
    fetch('data/listings.json' + bust, { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : { listings: [] }; }).catch(function () { return null; }),
    fetch('data/meta.json' + bust, { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return null; }),
    fetch('data/criteria.json' + bust, { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
  ]).then(function (res) {
    state.loading = false; btn.classList.remove('spin');
    if (!res[0]) { if (manual) toast('Pas de connexion, réessaie plus tard'); return; }
    var before = state.listings.length;
    state.listings = (res[0].listings || []).map(function (l) {
      l.url = E.safeUrl(l.url) || '#'; l.photo = E.safeUrl(l.photo, true);
      (l.sources || []).forEach(function (x) { x.url = E.safeUrl(x.url) || '#'; });
      return l;
    });
    state.meta = res[1] || {};
    // Critères du dépôt (ceux de la relève), tant qu'aucun réglage n'a été fait sur ce téléphone.
    if (res[2] && !LS.get('criteria', null)) state.criteria = res[2];
    var typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (!typing) keepScroll(render); else renderSync();
    if (manual) toast(state.listings.length > before && before ? (state.listings.length - before) + ' nouvelle(s) annonce(s)' : 'À jour');
    if (state.flash) {
      var el = document.getElementById('l-' + state.flash);
      if (el) setTimeout(function () { el.scrollIntoView({ block: 'start' }); }, 60);
    }
    maybeAlert();
  });
}
document.getElementById('refresh').addEventListener('click', function () { load(true); });
document.getElementById('scrim').addEventListener('click', closeSheet);
render();
load();
document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
window.addEventListener('online', function () { load(); });
window.addEventListener('offline', renderSync);
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
})();
</script>
